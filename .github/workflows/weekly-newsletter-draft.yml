# Started by cron-job.org at Mondays 6:00 AM Central via GitHub's API (workflow_dispatch),
# because GitHub's own schedule was starting these runs hours late.
# The "Run workflow" button in the Actions tab still works too.
# Builds the All MO Sports Weekly draft every Monday morning and commits
# the ratings snapshot + draft files back to the repo.
#
# The script and config live at the repo root.
# Step 1 (now): drafts land in newsletter_output/drafts/<week>/
#   Open preview.html to review; copy draft_blocks.html into a new
#   WordPress post (Code editor) to edit and send.
# Step 2 (later): this job will create the WordPress draft post directly.
 
name: Weekly newsletter draft
 
on:
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Sunday the week ends on (YYYY-MM-DD). Leave blank for last week."
        required: false
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install pyyaml
 
      - name: Build draft
        env:
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}   # passed as data, never pasted into the script
        run: |
          if [ -n "$WEEK_ENDING" ]; then
            if ! [[ "$WEEK_ENDING" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::week_ending must look like 2026-10-04"; exit 1
            fi
            python build_weekly_newsletter.py --week-ending "$WEEK_ENDING"
          else
            python build_weekly_newsletter.py
          fi
 
      - name: Commit snapshot and draft
        run: |
          git config user.name "All MO Sports Bot"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter_output
          git diff --cached --quiet || git commit -m "Weekly newsletter draft and ratings snapshot"
          git pull --rebase
          git push
 
