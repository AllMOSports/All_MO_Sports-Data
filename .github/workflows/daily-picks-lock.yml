# Locks All MO Sports picks for today's games every morning at 10:39 AM
# Central, using the latest ratings. The weekly newsletter grades these
# picks each Monday. A day that's already locked is never changed.
#
# GitHub cron only runs on UTC, so there are two entries -- one for
# Daylight time (CDT, UTC-5) and one for Standard time (CST, UTC-6) -- and
# the "gate" job lets only the one matching Chicago's current offset go
# ahead. That keeps it at 10:39 AM local all year, across the time changes.

name: Daily picks lock

on:
  schedule:
    - cron: "39 15 * * *"     # 10:39 AM CDT
    - cron: "39 16 * * *"     # 10:39 AM CST
  workflow_dispatch:
    inputs:
      day:
        description: "Day to lock (YYYY-MM-DD). Leave blank for today."
        required: false

permissions:
  contents: write

concurrency:
  group: daily-picks-lock
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          ZONE=$(TZ=America/Chicago date +%Z)
          RUN=false
          if [ -z "$SCHEDULE" ]; then
            RUN=true                                   # manual run
          elif [ "$SCHEDULE" = "39 15 * * *" ] && [ "$ZONE" = "CDT" ]; then
            RUN=true
          elif [ "$SCHEDULE" = "39 16 * * *" ] && [ "$ZONE" = "CST" ]; then
            RUN=true
          fi
          echo "Chicago is on $ZONE; trigger '${SCHEDULE:-manual}' -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

  lock:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Chicago        # so "today" means today in Missouri
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Lock today's picks
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            python build_weekly_newsletter.py --lock-picks "${{ github.event.inputs.day }}"
          else
            python build_weekly_newsletter.py --lock-picks
          fi

      - name: Commit picks
        run: |
          git config user.name "All MO Sports Bot"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter_output/picks
          git diff --cached --quiet || git commit -m "Lock daily picks"
          git pull --rebase
          git push
