# Started by cron-job.org at 5:49 AM Central via GitHub's API (workflow_dispatch),
# because GitHub's own schedule was starting these runs hours late.
# The "Run workflow" button in the Actions tab still works too.
# Locks All MO Sports picks for today's games every morning at 5:49 AM
# Central, using the latest ratings. The weekly newsletter grades these
# picks each Monday. A day that's already locked is never changed.
 
name: Daily picks lock
 
on:
  workflow_dispatch:
    inputs:
      day:
        description: "Day to lock (YYYY-MM-DD). Leave blank for today."
        required: false
 
permissions:
  contents: write
 
concurrency:
  group: daily-picks-lock
  cancel-in-progress: false
 
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          ZONE=$(TZ=America/Chicago date +%Z)
          RUN=false
          if [ -z "$SCHEDULE" ]; then
            RUN=true                                   # manual run
          elif [ "$SCHEDULE" = "39 15 * * *" ] && [ "$ZONE" = "CDT" ]; then
            RUN=true
          elif [ "$SCHEDULE" = "39 16 * * *" ] && [ "$ZONE" = "CST" ]; then
            RUN=true
          fi
          echo "Chicago is on $ZONE; trigger '${SCHEDULE:-manual}' -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
 
  lock:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Chicago        # so "today" means today in Missouri
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: pip install pyyaml
 
      - name: Lock today's picks
        env:
          DAY: ${{ github.event.inputs.day }}   # passed as data, never pasted into the script
        run: |
          if [ -n "$DAY" ]; then
            if ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::day must look like 2026-10-09"; exit 1
            fi
            python build_weekly_newsletter.py --lock-picks "$DAY"
          else
            python build_weekly_newsletter.py --lock-picks
          fi
 
      - name: Commit picks
        run: |
          git config user.name "All MO Sports Bot"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter_output/picks
          git diff --cached --quiet || git commit -m "Lock daily picks"
          git pull --rebase
          git push
