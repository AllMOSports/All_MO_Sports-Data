name: Build Boys Soccer History JSON
 
on:
  workflow_dispatch: {}          # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - 'Build_BoysSoccer_History_json.py'   # re-run if you edit the script
      - 'Aliases.json'                       # or update your alias map
 
permissions:
  contents: write   # needed to commit boys_soccer_history.json back to the repo
 
jobs:
  build-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
 
      # No external deps needed -- the script uses only stdlib (json, re,
      # urllib.request), same as the football version.
      - name: Run Build_Boys_Soccer_History_json.py
        run: python Build_Boys_Soccer_History_json.py
 
      - name: Commit and push boys_soccer_history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boys_soccer_history.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update boys_soccer_history.json"
          git push
