name: Scrape MSHSAA Season Records 2026-2027
 
on:
  schedule:
    # 08:00 UTC = 2:00 AM CST (Central Standard Time, UTC-6)
    # NOTE: GitHub Actions cron is fixed UTC and does not shift for DST.
    # During CDT (mid-March - early November), this fires at 3:00 AM local
    # instead of 2:00 AM. See chat note if you want true year-round 2:00 AM
    # local time instead (requires two schedule entries + seasonal upkeep).
    - cron: '0 8 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab for testing
 
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
 
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
 
      - name: Install dependencies
        run: pip install requests beautifulsoup4
 
      - name: Run scraper
        run: python Scrape_MSHSAA_Season_Records_2026-2027.py
 
      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/season_records/
          git diff --cached --quiet || git commit -m "Nightly season records scrape: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
