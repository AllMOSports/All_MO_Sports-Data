# Builds and sends the per-school "Follow your school" report emails.
#
# Runs on its own right after "Weekly newsletter draft" finishes (so Monday's ratings snapshot
# exists): it gets the real followers from WordPress, builds one email per follower, uploads the
# emails to the private Cloudflare bucket, and tells WordPress to send them (WordPress decides
# who actually gets one: test mode sends only to your test accounts).
#
# From the "Run workflow" button you can also build test emails (sample follows, one school, or
# every school) without sending anything; those are attached to the run as a zip.
#
# Every run also refreshes the web report data for every school (output/school_reports/ is
# public; the member-only parts go to Cloudflare).
#
# Secrets used: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET (Cloudflare),
# WP_FOLLOWERS_KEY (same value as AMOS_FOLLOWS_TOKEN in WordPress).

name: School reports

on:
  workflow_run:
    workflows: ["Weekly newsletter draft"]
    types: [completed]
  workflow_dispatch:
    inputs:
      followers:
        description: "Whose emails to build"
        type: choice
        options: ["sample (test file, nothing sent)", "real followers from WordPress"]
        default: "sample (test file, nothing sent)"
      send:
        description: "With real followers: send them (WordPress test mode still limits who gets one)"
        type: boolean
        default: false
      week_ending:
        description: "Sunday the week ends on (YYYY-MM-DD). Leave blank for last week."
        required: false
      all_schools:
        description: "Test: build an 'everything' email for every school (download the zip; not committed)"
        type: boolean
        default: false
      school:
        description: "Test one school by slug (e.g. st-vincent). Leave blank to use the followers choice."
        required: false
      sports:
        description: 'With a school: "all" or a comma list (e.g. football,girls_basketball)'
        required: false
        default: "all"
      follows_file:
        description: "Sample follows file (with the sample choice)"
        required: false
        default: "sample_follows.json"

permissions:
  contents: write

env:
  SITE: https://allmosports.com

jobs:
  build:
    # After the newsletter run, only continue if it succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # pick up the snapshot the newsletter run just committed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml pillow

      # Scheduled runs (and "real followers") use WordPress's list: account numbers and schools,
      # never email addresses. It stays in private_output/ (never committed).
      - name: Get followers from WordPress
        id: followers
        env:
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ github.event.inputs.followers }}
          SCHOOL: ${{ github.event.inputs.school }}
          ALL_SCHOOLS: ${{ github.event.inputs.all_schools }}
          KEY: ${{ secrets.WP_FOLLOWERS_KEY }}
        run: |
          use_real=false
          if [ "$EVENT" = "workflow_run" ]; then use_real=true; fi
          if [ "$CHOICE" = "real followers from WordPress" ]; then use_real=true; fi
          if [ -n "$SCHOOL" ] || [ "$ALL_SCHOOLS" = "true" ]; then use_real=false; fi
          if [ "$use_real" = "true" ] && [ -z "$KEY" ]; then
            echo "::warning::WP_FOLLOWERS_KEY secret not set; using the sample follows file instead."
            use_real=false
          fi
          if [ "$use_real" = "true" ]; then
            mkdir -p private_output
            code=$(curl -sS -o private_output/followers.json -w "%{http_code}" -H "X-AMOS-Token: $KEY" "$SITE/wp-json/amos/v1/followers")
            if [ "$code" != "200" ]; then
              echo "::error::WordPress answered $code for the followers list."; exit 1
            fi
            python3 -c "import json; d=json.load(open('private_output/followers.json')); assert isinstance(d, list); assert all('@' not in json.dumps(x) for x in d), 'email address in list'; print(len(d), 'followers')"
          fi
          echo "real=$use_real" >> "$GITHUB_OUTPUT"

      - name: Build school reports
        env:   # inputs are passed as data, never pasted into the script
          REAL: ${{ steps.followers.outputs.real }}
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}
          ALL_SCHOOLS: ${{ github.event.inputs.all_schools }}
          SCHOOL: ${{ github.event.inputs.school }}
          SPORTS: ${{ github.event.inputs.sports }}
          FOLLOWS: ${{ github.event.inputs.follows_file }}
        run: |
          args=()
          if [ -n "$WEEK_ENDING" ]; then
            [[ "$WEEK_ENDING" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::week_ending must look like 2026-11-15"; exit 1; }
            args+=(--week-ending "$WEEK_ENDING")
          fi
          if [ "$REAL" = "true" ]; then
            args+=(--follows private_output/followers.json --emails-out private_output/emails)
          elif [ "$ALL_SCHOOLS" = "true" ]; then
            args+=(--all-schools)
          elif [ -n "$SCHOOL" ]; then
            [[ "$SCHOOL" =~ ^[a-z0-9-]+$ ]] || { echo "::error::school must be a slug like st-vincent"; exit 1; }
            SPORTS="${SPORTS:-all}"
            [[ "$SPORTS" =~ ^(all|[a-z_]+(,[a-z_]+)*)$ ]] || { echo "::error::sports must be all or a comma list"; exit 1; }
            args+=(--school "$SCHOOL" --sports "$SPORTS")
          else
            FOLLOWS="${FOLLOWS:-sample_follows.json}"
            [[ "$FOLLOWS" =~ ^[A-Za-z0-9_./-]+\.json$ ]] || { echo "::error::follows_file must be a .json path"; exit 1; }
            args+=(--follows "$FOLLOWS")
          fi
          # --pages: also refresh every school's web report data (output/school_reports/)
          python build_school_reports.py "${args[@]}" --pages

      # Test emails only. Real followers' emails are private and never attached or committed.
      - name: Attach test emails to the run
        if: steps.followers.outputs.real != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: school-reports
          path: |
            newsletter_output/school_reports/
            output/school_reports/

      # Member-only page data and real emails (private_output/) go to the Cloudflare R2 bucket.
      - name: Upload member data to Cloudflare
        if: github.event.inputs.all_schools != 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets not set yet; skipping."; exit 0
          fi
          if [ ! -d private_output ]; then
            echo "No member-only data this run (private_data.enabled is off); skipping."; exit 0
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync private_output/ "s3://${R2_BUCKET}/" --endpoint-url "$endpoint" --content-type application/json \
            --exclude "followers.json" --exclude "emails/*" --only-show-errors
          if [ -d private_output/emails ]; then
            aws s3 sync private_output/emails/ "s3://${R2_BUCKET}/emails/" --endpoint-url "$endpoint" --only-show-errors
            echo "Uploaded $(find private_output/emails -name '*.html' | wc -l) email files."
          fi
          aws s3 cp access.json "s3://${R2_BUCKET}/_access.json" --endpoint-url "$endpoint" --content-type application/json --only-show-errors
          echo "Uploaded $(find private_output -path private_output/emails -prune -o -name '*.json' -print | grep -v followers.json | wc -l) member files."

      - name: Tell WordPress to send
        if: steps.followers.outputs.real == 'true'
        env:
          EVENT: ${{ github.event_name }}
          SEND: ${{ github.event.inputs.send }}
          KEY: ${{ secrets.WP_FOLLOWERS_KEY }}
        run: |
          if [ "$EVENT" != "workflow_run" ] && [ "$SEND" != "true" ]; then
            echo "Built and uploaded; not sending (the Send box was unchecked)."; exit 0
          fi
          week=$(python3 -c "import json,glob; m=sorted(glob.glob('private_output/emails/*/manifest.json')); print(json.load(open(m[-1]))['week_end'] if m else '')")
          if [ -z "$week" ]; then echo "No emails this week."; exit 0; fi
          resp=$(curl -sS -w "\n%{http_code}" -X POST -H "X-AMOS-Token: $KEY" -H "Content-Type: application/json" \
            -d "{\"week\":\"$week\"}" "$SITE/wp-json/amos/v1/send-week")
          code=$(echo "$resp" | tail -n1)
          echo "$resp" | head -n -1
          [ "$code" = "200" ] || { echo "::error::WordPress answered $code"; exit 1; }

      - name: Commit reports
        if: github.event.inputs.all_schools != 'true'   # all-school tests are only in the zip
        run: |
          git config user.name "All MO Sports Bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/school_reports
          # headline memory (keyed by follow set, never by person) and sample/test emails
          git add newsletter_output/school_reports
          git diff --cached --quiet || git commit -m "Weekly school reports"
          git pull --rebase
          git push
