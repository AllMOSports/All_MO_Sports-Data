# Builds the per-school "Follow your school" report emails.
#
# Runs on its own right after "Weekly newsletter draft" finishes (so that
# Monday's ratings snapshot exists), and from the "Run workflow" button
# in the Actions tab for tests.
#
# Nothing is sent. Emails land in newsletter_output/school_reports/<week>/
# and are also attached to the run as a downloadable "school-reports" zip.

name: School reports

on:
  workflow_run:
    workflows: ["Weekly newsletter draft"]
    types: [completed]
  workflow_dispatch:
    inputs:
      week_ending:
        description: "Sunday the week ends on (YYYY-MM-DD). Leave blank for last week."
        required: false
      school:
        description: "Test one school by slug (e.g. st-vincent). Leave blank to use the follows file."
        required: false
      sports:
        description: 'With a school: "all" or a comma list (e.g. football,girls_basketball)'
        required: false
        default: "all"
      follows_file:
        description: "Follows file to use when no school is given"
        required: false
        default: "sample_follows.json"

permissions:
  contents: write

jobs:
  build:
    # After the newsletter run, only continue if it succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # pick up the snapshot the newsletter run just committed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml pillow

      - name: Build school reports
        env:   # inputs are passed as data, never pasted into the script
          WEEK_ENDING: ${{ github.event.inputs.week_ending }}
          SCHOOL: ${{ github.event.inputs.school }}
          SPORTS: ${{ github.event.inputs.sports }}
          FOLLOWS: ${{ github.event.inputs.follows_file }}
        run: |
          args=()
          if [ -n "$WEEK_ENDING" ]; then
            [[ "$WEEK_ENDING" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::week_ending must look like 2026-11-15"; exit 1; }
            args+=(--week-ending "$WEEK_ENDING")
          fi
          if [ -n "$SCHOOL" ]; then
            [[ "$SCHOOL" =~ ^[a-z0-9-]+$ ]] || { echo "::error::school must be a slug like st-vincent"; exit 1; }
            SPORTS="${SPORTS:-all}"
            [[ "$SPORTS" =~ ^(all|[a-z_]+(,[a-z_]+)*)$ ]] || { echo "::error::sports must be all or a comma list"; exit 1; }
            args+=(--school "$SCHOOL" --sports "$SPORTS")
          else
            FOLLOWS="${FOLLOWS:-sample_follows.json}"
            [[ "$FOLLOWS" =~ ^[A-Za-z0-9_./-]+\.json$ ]] || { echo "::error::follows_file must be a .json path"; exit 1; }
            args+=(--follows "$FOLLOWS")
          fi
          python build_school_reports.py "${args[@]}"

      - name: Attach emails to the run
        uses: actions/upload-artifact@v4
        with:
          name: school-reports
          path: newsletter_output/school_reports/

      - name: Commit reports
        run: |
          git config user.name "All MO Sports Bot"
          git config user.email "actions@users.noreply.github.com"
          git add newsletter_output/school_reports
          git diff --cached --quiet || git commit -m "Weekly school reports"
          git pull --rebase
          git push
