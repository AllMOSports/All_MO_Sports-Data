# .github/workflows/build-team-resume.yml
#
# Runs scripts/Build_Team_Resume.py and commits output/team_resume/*.json/.csv.
# Reads ratings + games straight from each sport's ratings repo (raw GitHub
# URLs), so run it AFTER the nightly ratings workflows have finished.
#
# Triggers:
#   - repository_dispatch (event_type: build-team-resume) from cron-job.org,
#     same as the other nightly jobs. Optional client_payload.sports, e.g.
#     {"event_type":"build-team-resume","client_payload":{"sports":"football"}}
#   - workflow_dispatch: manual run from the Actions tab (optional sports list)
#   - schedule: late-morning backup in case a cron-job.org call is missed

name: Build Team Resume

on:
  repository_dispatch:
    types: [build-team-resume]
  workflow_dispatch:
    inputs:
      sports:
        description: "Sport keys separated by spaces (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "15 15 * * *"   # ~9 AM Central backup

permissions:
  contents: write

concurrency:
  group: build-team-resume
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build team resumes
        env:
          SPORTS: ${{ github.event.inputs.sports || github.event.client_payload.sports || '' }}
        run: python scripts/Build_Team_Resume.py $SPORTS

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/team_resume
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update team resumes ($(TZ=America/Chicago date +'%Y-%m-%d %H:%M CT'))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1
