# .github/workflows/build-football-quad-history.yml
#
# Runs Build_Football_Quad_History.py and commits the historical quad record
# files (2010-2025) to output/mshsaa_historical_records/football/.
#
# Historical data rarely changes, so this only runs when the script or one of
# its inputs changes, or when you click "Run workflow" in the Actions tab.
# No MSHSAA access, so runner IP blocking doesn't matter here.

name: Build Football Quad History (2010-2025)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Build_Football_Quad_History.py"
      - "output/football_schedule_20[12][0-9].json"
      - "output/mshsaa_historical_records/football/Football_Ratings_History_2010-2025.json"
      - "output/state_tournament_history.json"

permissions:
  contents: write

concurrency:
  group: build-football-quad-history
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # standard library only, runs in seconds

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build historical quad records
        run: python Build_Football_Quad_History.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/mshsaa_historical_records/football/Football_Quad_Records_History_2010-2025.json \
                  output/mshsaa_historical_records/football/Football_Quad_Records_History_2010-2025.csv \
                  output/mshsaa_historical_records/football/Football_Quad_History_Summary_2010-2025.csv \
                  output/mshsaa_historical_records/football/Football_Quad_History_Summary_2010-2025.json
          if git diff --cached --quiet; then
            echo "No changes to quad history."
            exit 0
          fi
          git commit -m "Update football quad history ($(TZ=America/Chicago date +'%Y-%m-%d %H:%M CT'))"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push failed (attempt $i), retrying..."
            sleep 5
          done
          exit 1
