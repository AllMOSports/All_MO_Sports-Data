name: Build Scorigami

on:
  workflow_dispatch:          # run by hand, or trigger from cron-job.org like the other nightly jobs
    inputs:
      sports:
        description: 'Sports to build (space separated): football boys_basketball girls_basketball'
        required: false
        default: 'football boys_basketball girls_basketball'
  schedule:
    - cron: '30 13 * * *'     # backup run ~7-8 AM Central (GitHub often starts scheduled runs late)

permissions:
  contents: write

concurrency:
  group: scorigami
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Seasons are keyed by start year: basketball 2026 = 2026-27.
      # Bump these each new season.
      - name: Build scorigami data
        id: build
        continue-on-error: true      # one sport failing should not block the others from committing
        run: |
          python scripts/Build_Scorigami.py ${{ github.event.inputs.sports || 'football boys_basketball girls_basketball' }} \
            --football-season 2026 --basketball-season 2026

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/scorigami
          git diff --cached --quiet || git commit -m "Scorigami $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Fail if any sport failed
        if: steps.build.outcome == 'failure'
        run: exit 1
