name: Build Scorigami

# Triggered every morning by cron-job.org (workflow_dispatch through the GitHub API),
# or by hand from the Actions tab. No GitHub schedule: a second daily run would send
# a second email that always says "0 new".
on:
  workflow_dispatch:
    inputs:
      sports:
        description: 'Sports to build (space separated): football boys_basketball girls_basketball'
        required: false
        default: 'football boys_basketball girls_basketball'
      email:
        description: 'Send the daily email report (true/false)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: scorigami
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Seasons are keyed by start year: basketball 2026 = 2026-27.
      # Bump these each new season.
      - name: Build scorigami data and email the report
        id: build
        continue-on-error: true      # one sport failing should not block the others from committing
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: allmosports63775@gmail.com
        run: |
          EMAIL_FLAG=""
          if [ "${{ github.event.inputs.email || 'true' }}" = "true" ]; then EMAIL_FLAG="--email"; fi
          python scripts/Build_Scorigami.py ${{ github.event.inputs.sports || 'football boys_basketball girls_basketball' }} \
            --football-season 2026 --basketball-season 2026 $EMAIL_FLAG

      # Committing matters for the email: the next run compares against these files
      # to find what is new.
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/scorigami
          git diff --cached --quiet || git commit -m "Scorigami $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash
          git push

      - name: Fail if any sport or the email failed
        if: steps.build.outcome == 'failure'
        run: exit 1
