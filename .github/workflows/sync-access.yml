# Copies access.json (who can see what) to the Cloudflare data server whenever it changes.
# The Worker re-reads it within 5 minutes; WordPress within 1 hour.
name: Sync access rules

on:
  push:
    branches: [main]
    paths: [access.json]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check access.json
        run: python3 -c "import json; a=json.load(open('access.json')); lv=a['levels']; bad=[k for k,v in a['features'].items() if v not in lv]; assert not bad, bad; assert all(f in a['features'] for f in a['files'].values())"

      - name: Upload to Cloudflare
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "::error::Add the R2 secrets first (see README_member_data.md)."; exit 1
          fi
          aws s3 cp access.json "s3://${R2_BUCKET}/_access.json" --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --content-type application/json
