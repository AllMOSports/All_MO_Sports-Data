# All MO Sports Weekly - newsletter settings
# ------------------------------------------------------------
# Edit this file to change what the weekly draft includes.
# No code changes needed: turn sports on/off, change list sizes,
# or feature specific teams here.

brand: All MO Sports
site_url: https://allmosports.com
twitter_handle: "@All_MO_Sports"

# How many teams in each sport's "Statewide top" list.
top_n: 5

# "list" (default) shows the top teams as a list with logos.
# "table" uses a table instead; some site plugins add a search box to tables.
top_style: list

# School logos (same files the site uses). Remove logo_base_url to turn logos off.
schools_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/output/schools.json
logo_base_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/logos_main2/

# "What happened": results between two teams ranked this high or better.
results_rank_cutoff: 25
results_max: 4

# "Games to watch": upcoming games (next 7 days) between ranked teams.
watch_rank_cutoff: 25
watch_max: 3

# "Still unbeaten": teams with no losses and at least this many wins.
# Ties still count as unbeaten.
unbeaten_min_wins: 5
unbeaten_max_listed: 12

# Upsets shown per sport (the biggest by rating gap).
upsets_max: 1

# Sections you can turn on or off.
sections:
  class_leaders: true    # No. 1 team in each class, per sport
  picks_record: true     # "How our picks did": grades last week's picks (starts after the first week)
  movers: true           # Biggest movers (needs last week's snapshot, so starts the second week)
  by_the_numbers: true   # Highest-scoring game, biggest margin, win streaks, top offense/defense
  history: true          # "This week in history" from past seasons

# Biggest movers: only teams ranked this high now (risers) or last week (fallers).
movers_rank_window: 50
movers_min: 3            # smallest move worth listing
movers_max: 2            # risers and fallers shown per sport

# This week in history.
#   best  = search every past season and feature the best game from this week in any year
#   years = only try the seasons listed in history_years_ago, in that order
history_mode: best
history_years_ago: [10, 5, 15]

# Always add a short "Featured teams" section with these schools' results
# for the week (use the exact school name from the ratings files).
featured_teams: []

# Schools to leave out of every list (rarely needed).
exclude_teams: []

sports:
  football:
    enabled: true
    label: Football
    unit: points
    ratings_url: https://raw.githubusercontent.com/AllMOSports/football-ratings-2026/main/football_ratings_2026.json
    # Football uses the per-team schedule file instead of a flat games list.
    schedule_url: https://raw.githubusercontent.com/AllMOSports/football-ratings-2026/main/team_schedules_2026.json
    rankings_page: https://allmosports.com/football-rankings/
    upset_min_gap: 10        # rating points the loser had to be better by
    predicted_scores: true   # show "Our pick: Team 31-21" for football
    league_average: 26       # same constant as the Matchup Predictor
    numbers: [high_score, margin, streak, offense, defense]
    history_ratings_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/output/mshsaa_historical_records/football/Football_Ratings_History_2010-2025.json
    history_schedule_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/output/football_schedule_{year}.json

  boys_soccer:
    enabled: true
    label: Boys Soccer
    unit: goals
    ratings_url: https://raw.githubusercontent.com/AllMOSports/Boys_Soccer_Ratings_2026/main/boys_soccer_ratings_2026.json
    games_url: https://raw.githubusercontent.com/AllMOSports/Boys_Soccer_Ratings_2026/main/boys_soccer_games_2026_all.json
    rankings_page: https://allmosports.com/boys-soccer-rankings/
    upset_min_gap: 1.5
    numbers: [high_score, margin, streak, offense, defense]
    history_ratings_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/output/mshsaa_historical_records/boys_soccer/Boys_Soccer_Ratings_History_2012-2025.json
    history_schedule_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/output/boys_soccer_schedule_{year}.json

  girls_volleyball:
    enabled: true
    label: Girls Volleyball
    unit: sets
    ratings_url: https://raw.githubusercontent.com/AllMOSports/Girls_Volleyball_Ratings_2026/main/girls_volleyball_ratings_2026.json
    games_url: https://raw.githubusercontent.com/AllMOSports/Girls_Volleyball_Ratings_2026/main/girls_volleyball_games_2026_all.json
    rankings_page: https://allmosports.com/girls-volleyball-rankings/
    upset_min_gap: 1.0
    numbers: [streak]        # volleyball: OVR only, no OFF/DEF or point totals
    history_ratings_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/output/mshsaa_historical_records/girls_volleyball/Girls_Volleyball_Ratings_History_2012-2025.json
    history_schedule_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/output/girls_volleyball_schedule_{year}.json

  fall_softball:
    enabled: true
    label: Fall Softball
    unit: runs
    ratings_url: https://raw.githubusercontent.com/AllMOSports/Fall_Softball_Ratings_2026/main/fall_softball_ratings_2026.json
    games_url: https://raw.githubusercontent.com/AllMOSports/Fall_Softball_Ratings_2026/main/fall_softball_games_2026_all.json
    rankings_page: https://allmosports.com/fall-softball-rankings/
    upset_min_gap: 4
    numbers: [high_score, margin, streak, offense, defense]
    history_ratings_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/output/mshsaa_historical_records/fall_softball/Fall_Softball_Ratings_History_2012-2025.json
    history_schedule_url: https://raw.githubusercontent.com/AllMOSports/All_MO_Sports-Data/main/output/fall_softball_schedule_{year}.json

# Closing call-to-action at the bottom of the newsletter.
closing_cta:
  enabled: true
  heading: Districts are almost here
  text: See where your football team would be seeded today, then fill in the bracket yourself.
  links:
    - label: Bracket Predictor
      url: https://allmosports.com/football-postseason-bracket-predictor/
    - label: District Points
      url: https://allmosports.com/district-points-predictor/
